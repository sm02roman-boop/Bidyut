# Free Apple ID build.
#
# A personal team cannot sign the App Groups entitlement, and without it a
# widget extension has no way to read the app's data. So this spec builds the
# app alone: no widget, no Live Activity, no App Group.
#
# Everything you actually open the app for still works — balance, forecast,
# slab warnings, Friendly Hour, recharge sheet, token, bill audit, charts,
# notifications and Siri.
#
#   xcodegen generate --spec project-free.yml
#
# Switch to project.yml once you have a paid developer account.

name: Bidyut
options:
  bundleIdPrefix: com.codeyo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # Xcode > Signing & Capabilities fills this in
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:

  Bidyut:
    type: application
    platform: iOS
    sources:
      # Every source file still compiles, including the Live Activity
      # controller — SyncService calls it, so removing it would break the
      # build. Without a widget extension there is nothing to draw the
      # activity, and the request simply fails and is ignored.
      - path: Sources
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Bidyut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.codeyo.bidyut.refresh
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - bkash
          - bKash
          - nagad
          - com.konasl.nagad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeyo.bidyut
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        # No entitlements file at all: nothing here needs one, and an empty
        # App Groups entitlement is exactly what breaks personal-team signing.
        CODE_SIGN_ENTITLEMENTS: ""

  BidyutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Bidyut
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeyo.bidyut.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Bidyut:
    build:
      targets:
        Bidyut: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BidyutTests
