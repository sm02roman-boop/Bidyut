# Builds an unsigned Bidyut.ipa on GitHub's macOS runners.
#
# For anyone without Xcode on their own Mac: GitHub's runners have it, so the
# .ipa can be built there and downloaded, then signed and installed with
# Sideloadly, which re-signs with your own Apple ID.
#
# Run it from the Actions tab ("Run workflow"), or by pushing to main. The
# .ipa appears under the run's Artifacts.

name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # The Intel pool: the Apple-silicon pools never assigned a runner to this
    # account, while this one picks jobs up straight away.
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # The newest Xcode on the image; the project needs Xcode 15 or later.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned .ipa
        run: ./build-ipa.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Bidyut-ipa
          path: build/Bidyut.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish to the "latest" release
        # A stable download link that works from a phone browser.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/Bidyut.ipa \
            --title "Bidyut (latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install with Sideloadly using your own Apple ID." \
            --prerelease

      - name: Publish to the ipa branch
        # Also on a branch, so the .ipa can be fetched with plain git.
        run: |
          mkdir /tmp/ipa-branch && cp build/Bidyut.ipa /tmp/ipa-branch/
          cd /tmp/ipa-branch
          git init -q -b ipa
          git -c user.name="github-actions" -c user.email="actions@github.com" add Bidyut.ipa
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ipa
